<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" width="100%" height="100%">
  <defs>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111827" />
      <stop offset="100%" stop-color="#0B0F19" />
    </linearGradient>
    <filter id="fShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, sans-serif; }
    .mono { font-family: "JetBrains Mono", Consolas, monospace; }
  </style>

  <!-- Pillar 1 -->
  <g transform="translate(10, 10)" filter="url(#fShadow)">
    <rect width="230" height="340" rx="16" fill="url(#cardBg)" stroke="rgba(0, 240, 255, 0.3)" stroke-width="1.2" />
    <circle cx="44" cy="44" r="20" fill="rgba(0, 240, 255, 0.15)" stroke="#00F0FF" stroke-width="1.5" />
    <text x="36" y="50" class="sans" font-size="16">🔒</text>
    <text x="74" y="42" class="sans" font-size="15" font-weight="800" fill="#FFFFFF">Zero-Cloud</text>
    <text x="74" y="58" class="mono" font-size="11" font-weight="600" fill="#00F0FF">SQLite &amp; Biometrics</text>

    <text x="20" y="96" class="sans" font-size="12" fill="#94A3B8" line-height="1.4">
      Your money data never touches external cloud servers or trackers.
    </text>

    <g transform="translate(16, 130)">
      <rect width="198" height="52" rx="8" fill="rgba(0,0,0,0.4)" stroke="rgba(255,255,255,0.06)" />
      <text x="12" y="22" class="mono" font-size="10" fill="#38BDF8">HARDWARE KEYSTORE</text>
      <text x="12" y="38" class="sans" font-size="12" font-weight="700" fill="#F8FAFC">AES-256-GCM + SAF</text>
    </g>

    <text x="20" y="215" class="sans" font-size="11" fill="#E2E8F0">• Fingerprint &amp; Face ID gate</text>
    <text x="20" y="235" class="sans" font-size="11" fill="#E2E8F0">• Native SQLite transactions</text>
    <text x="20" y="255" class="sans" font-size="11" fill="#E2E8F0">• Salted SHA-256 Master PIN</text>
    <text x="20" y="275" class="sans" font-size="11" fill="#E2E8F0">• 100% offline air-gapped</text>
    <text x="20" y="295" class="sans" font-size="11" fill="#E2E8F0">• Encrypted backup files</text>
  </g>

  <!-- Pillar 2 -->
  <g transform="translate(255, 10)" filter="url(#fShadow)">
    <rect width="230" height="340" rx="16" fill="url(#cardBg)" stroke="rgba(16, 185, 129, 0.3)" stroke-width="1.2" />
    <circle cx="44" cy="44" r="20" fill="rgba(16, 185, 129, 0.15)" stroke="#10B981" stroke-width="1.5" />
    <text x="36" y="50" class="sans" font-size="16">🧠</text>
    <text x="74" y="42" class="sans" font-size="15" font-weight="800" fill="#FFFFFF">Trust Score</text>
    <text x="74" y="58" class="mono" font-size="11" font-weight="600" fill="#10B981">Neural Risk Engine</text>

    <text x="20" y="96" class="sans" font-size="12" fill="#94A3B8">
      Proprietary repayment integrity scoring algorithm from 0 to 100.
    </text>

    <g transform="translate(16, 130)">
      <rect width="198" height="52" rx="8" fill="rgba(0,0,0,0.4)" stroke="rgba(255,255,255,0.06)" />
      <text x="12" y="22" class="mono" font-size="10" fill="#34D399">BORROWER TIER</text>
      <text x="12" y="38" class="sans" font-size="12" font-weight="700" fill="#F8FAFC">98/100 Elite Status</text>
    </g>

    <text x="20" y="215" class="sans" font-size="11" fill="#E2E8F0">• Repayment velocity factor</text>
    <text x="20" y="235" class="sans" font-size="11" fill="#E2E8F0">• Overdue penalty matrix</text>
    <text x="20" y="255" class="sans" font-size="11" fill="#E2E8F0">• Consistency scoring</text>
    <text x="20" y="275" class="sans" font-size="11" fill="#E2E8F0">• 4 Algorithmic tiers</text>
    <text x="20" y="295" class="sans" font-size="11" fill="#E2E8F0">• Delinquency warnings</text>
  </g>

  <!-- Pillar 3 -->
  <g transform="translate(500, 10)" filter="url(#fShadow)">
    <rect width="230" height="340" rx="16" fill="url(#cardBg)" stroke="rgba(168, 85, 247, 0.3)" stroke-width="1.2" />
    <circle cx="44" cy="44" r="20" fill="rgba(168, 85, 247, 0.15)" stroke="#A855F7" stroke-width="1.5" />
    <text x="36" y="50" class="sans" font-size="16">⚡</text>
    <text x="74" y="42" class="sans" font-size="15" font-weight="800" fill="#FFFFFF">Dynamic UPI</text>
    <text x="74" y="58" class="mono" font-size="11" font-weight="600" fill="#A855F7">Instant Settle</text>

    <text x="20" y="96" class="sans" font-size="12" fill="#94A3B8">
      Generate dynamic QR codes encoded with transaction amount and recipient.
    </text>

    <g transform="translate(16, 130)">
      <rect width="198" height="52" rx="8" fill="rgba(0,0,0,0.4)" stroke="rgba(255,255,255,0.06)" />
      <text x="12" y="22" class="mono" font-size="10" fill="#C084FC">SUPPORTED APPS</text>
      <text x="12" y="38" class="sans" font-size="12" font-weight="700" fill="#F8FAFC">GPay • PhonePe • Paytm • CRED</text>
    </g>

    <text x="20" y="215" class="sans" font-size="11" fill="#E2E8F0">• Auto-calculated balance</text>
    <text x="20" y="235" class="sans" font-size="11" fill="#E2E8F0">• 1-Tap WhatsApp debt slip</text>
    <text x="20" y="255" class="sans" font-size="11" fill="#E2E8F0">• Camera QR scanner ready</text>
    <text x="20" y="275" class="sans" font-size="11" fill="#E2E8F0">• Partial payment capture</text>
    <text x="20" y="295" class="sans" font-size="11" fill="#E2E8F0">• Instant debt write-off</text>
  </g>

  <!-- Pillar 4 -->
  <g transform="translate(745, 10)" filter="url(#fShadow)">
    <rect width="245" height="340" rx="16" fill="url(#cardBg)" stroke="rgba(245, 158, 11, 0.3)" stroke-width="1.2" />
    <circle cx="44" cy="44" r="20" fill="rgba(245, 158, 11, 0.15)" stroke="#F59E0B" stroke-width="1.5" />
    <text x="36" y="50" class="sans" font-size="16">🎨</text>
    <text x="74" y="42" class="sans" font-size="15" font-weight="800" fill="#FFFFFF">Fintech UI</text>
    <text x="74" y="58" class="mono" font-size="11" font-weight="600" fill="#F59E0B">Custom Launcher &amp; Docs</text>

    <text x="20" y="96" class="sans" font-size="12" fill="#94A3B8">
      Pro PDF statements, multi-tab Excel workbooks, and custom launcher icons.
    </text>

    <g transform="translate(16, 130)">
      <rect width="213" height="52" rx="8" fill="rgba(0,0,0,0.4)" stroke="rgba(255,255,255,0.06)" />
      <text x="12" y="22" class="mono" font-size="10" fill="#FBBF24">NATIVE THEME ENGINE</text>
      <text x="12" y="38" class="sans" font-size="12" font-weight="700" fill="#F8FAFC">10 Launcher Activity Aliases</text>
    </g>

    <text x="20" y="215" class="sans" font-size="11" fill="#E2E8F0">• Vector circle PDF badges</text>
    <text x="20" y="235" class="sans" font-size="11" fill="#E2E8F0">• Typography studio &amp; preview</text>
    <text x="20" y="255" class="sans" font-size="11" fill="#E2E8F0">• Dynamic currency symbols</text>
    <text x="20" y="275" class="sans" font-size="11" fill="#E2E8F0">• Sub-35ms contact picker</text>
    <text x="20" y="295" class="sans" font-size="11" fill="#E2E8F0">• 1-Tap APK in-app updater</text>
  </g>
</svg>
