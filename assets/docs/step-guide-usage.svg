<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 340" width="100%" height="100%">
  <defs>
    <linearGradient id="flowBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E1726" />
      <stop offset="100%" stop-color="#070A12" />
    </linearGradient>
    <linearGradient id="cardGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(30, 41, 59, 0.85)" />
      <stop offset="100%" stop-color="rgba(15, 23, 42, 0.95)" />
    </linearGradient>
    <filter id="fShadow2" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, sans-serif; }
    .mono { font-family: "JetBrains Mono", Consolas, monospace; }
  </style>

  <rect width="1000" height="340" rx="16" fill="url(#flowBg)" stroke="rgba(255, 255, 255, 0.08)" />

  <text x="32" y="38" class="sans" font-size="13" font-weight="700" fill="#38BDF8" letter-spacing="1">COMPLETE USER LIFECYCLE WALKTHROUGH</text>
  <text x="32" y="58" class="sans" font-size="11" font-weight="400" fill="#94A3B8">From account creation to military-grade backup: how Abhi's Ledger manages your credit flow</text>

  <!-- Flow 1: Create Profile -->
  <g transform="translate(32, 80)" filter="url(#fShadow2)">
    <rect width="215" height="230" rx="12" fill="url(#cardGrad2)" stroke="rgba(56, 189, 248, 0.3)" />
    <circle cx="34" cy="34" r="14" fill="#38BDF8" />
    <text x="29" y="39" class="mono" font-size="13" font-weight="800" fill="#000">1</text>
    <text x="58" y="32" class="sans" font-size="14" font-weight="700" fill="#FFFFFF">Add Contact</text>
    <text x="58" y="47" class="mono" font-size="10" fill="#94A3B8">Native Cursor</text>

    <!-- Mini graphic -->
    <rect x="16" y="66" width="183" height="54" rx="8" fill="rgba(0,0,0,0.35)" />
    <text x="26" y="86" class="sans" font-size="11" font-weight="700" fill="#E2E8F0">👤 Pick from Address Book</text>
    <text x="26" y="104" class="mono" font-size="9" fill="#38BDF8">&lt;35ms hardware query</text>

    <text x="16" y="145" class="sans" font-size="11" fill="#CBD5E1">Tap <tspan font-weight="700" fill="#FFF">Add Person</tspan> or import directly from device contacts without typing.</text>
    <text x="16" y="195" class="sans" font-size="10" fill="#64748B">Instant auto-completion with relevance ranking &amp; phone link.</text>
  </g>

  <!-- Flow 2: Record Deal -->
  <g transform="translate(272, 80)" filter="url(#fShadow2)">
    <rect width="215" height="230" rx="12" fill="url(#cardGrad2)" stroke="rgba(52, 211, 153, 0.3)" />
    <circle cx="34" cy="34" r="14" fill="#34D399" />
    <text x="29" y="39" class="mono" font-size="13" font-weight="800" fill="#000">2</text>
    <text x="58" y="32" class="sans" font-size="14" font-weight="700" fill="#FFFFFF">Create Deal</text>
    <text x="58" y="47" class="mono" font-size="10" fill="#94A3B8">Given vs. Taken</text>

    <!-- Mini graphic -->
    <rect x="16" y="66" width="183" height="54" rx="8" fill="rgba(0,0,0,0.35)" />
    <text x="26" y="86" class="sans" font-size="11" font-weight="700" fill="#34D399">+ ₹10,000 Given</text>
    <text x="26" y="104" class="mono" font-size="9" fill="#94A3B8">Due: Nov 20 • Smart alert</text>

    <text x="16" y="145" class="sans" font-size="11" fill="#CBD5E1">Select <tspan font-weight="700" fill="#FFF">Lend / Borrow</tspan>, enter principal, due date, and optional interest rate.</text>
    <text x="16" y="195" class="sans" font-size="10" fill="#64748B">AlarmManager schedules native device wake-up reminder.</text>
  </g>

  <!-- Flow 3: Settle & Repay -->
  <g transform="translate(512, 80)" filter="url(#fShadow2)">
    <rect width="215" height="230" rx="12" fill="url(#cardGrad2)" stroke="rgba(192, 132, 252, 0.3)" />
    <circle cx="34" cy="34" r="14" fill="#C084FC" />
    <text x="29" y="39" class="mono" font-size="13" font-weight="800" fill="#000">3</text>
    <text x="58" y="32" class="sans" font-size="14" font-weight="700" fill="#FFFFFF">Instant Settle</text>
    <text x="58" y="47" class="mono" font-size="10" fill="#94A3B8">Dynamic UPI QR</text>

    <!-- Mini graphic -->
    <rect x="16" y="66" width="183" height="54" rx="8" fill="rgba(0,0,0,0.35)" />
    <text x="26" y="86" class="sans" font-size="11" font-weight="700" fill="#C084FC">📲 Scan with GPay/PhonePe</text>
    <text x="26" y="104" class="mono" font-size="9" fill="#94A3B8">1-Tap WhatsApp debt slip</text>

    <text x="16" y="145" class="sans" font-size="11" fill="#CBD5E1">Borrower scans dynamic QR with any UPI app; amounts pre-filled to eliminate disputes.</text>
    <text x="16" y="195" class="sans" font-size="10" fill="#64748B">Records partial payments and boosts Neural Trust Score.</text>
  </g>

  <!-- Flow 4: Export & Backup -->
  <g transform="translate(752, 80)" filter="url(#fShadow2)">
    <rect width="215" height="230" rx="12" fill="url(#cardGrad2)" stroke="rgba(251, 191, 36, 0.3)" />
    <circle cx="34" cy="34" r="14" fill="#FBBF24" />
    <text x="29" y="39" class="mono" font-size="13" font-weight="800" fill="#000">4</text>
    <text x="58" y="32" class="sans" font-size="14" font-weight="700" fill="#FFFFFF">Export &amp; Shield</text>
    <text x="58" y="47" class="mono" font-size="10" fill="#94A3B8">PDF &amp; Encrypted SAF</text>

    <!-- Mini graphic -->
    <rect x="16" y="66" width="183" height="54" rx="8" fill="rgba(0,0,0,0.35)" />
    <text x="26" y="86" class="sans" font-size="11" font-weight="700" fill="#FBBF24">🧾 Branded Light PDF</text>
    <text x="26" y="104" class="mono" font-size="9" fill="#94A3B8">AES-256-GCM Master File</text>

    <text x="16" y="145" class="sans" font-size="11" fill="#CBD5E1">Generate print-ready statement with vector status badges or export multi-tab XLSX workbooks.</text>
    <text x="16" y="195" class="sans" font-size="10" fill="#64748B">Backups secured via Android Hardware KeyStore.</text>
  </g>
</svg>
