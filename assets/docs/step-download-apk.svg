<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 320" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19" />
      <stop offset="100%" stop-color="#05080F" />
    </linearGradient>
    <linearGradient id="stepGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(30, 41, 59, 0.9)" />
      <stop offset="100%" stop-color="rgba(15, 23, 42, 0.95)" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, sans-serif; }
    .mono { font-family: "JetBrains Mono", Consolas, monospace; }
  </style>

  <rect width="1000" height="320" rx="16" fill="url(#bg)" stroke="rgba(255, 255, 255, 0.08)" />

  <!-- Section Header -->
  <text x="32" y="38" class="sans" font-size="13" font-weight="700" fill="#00F0FF" letter-spacing="1">1-TAP DIRECT APK INSTALLATION LIFECYCLE</text>
  <text x="32" y="58" class="sans" font-size="11" font-weight="400" fill="#64748B">Sideloading reimagined: No manual downloads folder browsing, zero telemetry, instant upgrade</text>

  <!-- Step 1 -->
  <g transform="translate(32, 80)" filter="url(#shadow)">
    <rect width="215" height="210" rx="14" fill="url(#stepGrad)" stroke="rgba(0, 240, 255, 0.25)" />
    <circle cx="36" cy="36" r="16" fill="rgba(0, 240, 255, 0.15)" stroke="#00F0FF" stroke-width="1.5" />
    <text x="31" y="42" class="mono" font-size="14" font-weight="800" fill="#00F0FF">1</text>
    <text x="64" y="34" class="sans" font-size="14" font-weight="700" fill="#FFFFFF">Auto-Detect</text>
    <text x="64" y="49" class="mono" font-size="10" fill="#94A3B8">Background Alert</text>
    
    <rect x="18" y="72" width="179" height="60" rx="8" fill="rgba(0, 0, 0, 0.4)" stroke="rgba(255, 255, 255, 0.06)" />
    <text x="28" y="93" class="sans" font-size="11" font-weight="700" fill="#38BDF8">⚡ Ledger v3.5 Available</text>
    <text x="28" y="111" class="sans" font-size="10" fill="#94A3B8">AlarmManager checks</text>
    <text x="28" y="123" class="sans" font-size="10" fill="#94A3B8">every 12h or on boot.</text>

    <text x="18" y="160" class="sans" font-size="11" fill="#E2E8F0" font-weight="600">• System tray notification</text>
    <text x="18" y="178" class="sans" font-size="11" fill="#E2E8F0" font-weight="600">• In-app bottom slide banner</text>
    <text x="18" y="196" class="sans" font-size="11" fill="#E2E8F0" font-weight="600">• Direct changelog peek</text>
  </g>

  <!-- Arrow 1 to 2 -->
  <g transform="translate(254, 175)">
    <path d="M0 0 L15 0" stroke="#00F0FF" stroke-width="2" stroke-dasharray="3,3" />
    <polygon points="15,-4 22,0 15,4" fill="#00F0FF" />
  </g>

  <!-- Step 2 -->
  <g transform="translate(282, 80)" filter="url(#shadow)">
    <rect width="215" height="210" rx="14" fill="url(#stepGrad)" stroke="rgba(16, 185, 129, 0.25)" />
    <circle cx="36" cy="36" r="16" fill="rgba(16, 185, 129, 0.15)" stroke="#10B981" stroke-width="1.5" />
    <text x="31" y="42" class="mono" font-size="14" font-weight="800" fill="#10B981">2</text>
    <text x="64" y="34" class="sans" font-size="14" font-weight="700" fill="#FFFFFF">1-Tap Trigger</text>
    <text x="64" y="49" class="mono" font-size="10" fill="#94A3B8">Single Press</text>

    <rect x="18" y="72" width="179" height="60" rx="8" fill="rgba(10, 132, 255, 0.15)" stroke="#0A84FF" stroke-width="1" />
    <text x="46" y="108" class="sans" font-size="13" font-weight="700" fill="#FFFFFF">⚡ 1-Tap Install</text>

    <text x="18" y="160" class="sans" font-size="11" fill="#E2E8F0" font-weight="600">• Verifies permissions</text>
    <text x="18" y="178" class="sans" font-size="11" fill="#E2E8F0" font-weight="600">• No browser redirects</text>
    <text x="18" y="196" class="sans" font-size="11" fill="#E2E8F0" font-weight="600">• Sideload assist toggle</text>
  </g>

  <!-- Arrow 2 to 3 -->
  <g transform="translate(504, 175)">
    <path d="M0 0 L15 0" stroke="#10B981" stroke-width="2" stroke-dasharray="3,3" />
    <polygon points="15,-4 22,0 15,4" fill="#10B981" />
  </g>

  <!-- Step 3 -->
  <g transform="translate(532, 80)" filter="url(#shadow)">
    <rect width="215" height="210" rx="14" fill="url(#stepGrad)" stroke="rgba(245, 158, 11, 0.25)" />
    <circle cx="36" cy="36" r="16" fill="rgba(245, 158, 11, 0.15)" stroke="#F59E0B" stroke-width="1.5" />
    <text x="31" y="42" class="mono" font-size="14" font-weight="800" fill="#F59E0B">3</text>
    <text x="64" y="34" class="sans" font-size="14" font-weight="700" fill="#FFFFFF">Direct Stream</text>
    <text x="64" y="49" class="mono" font-size="10" fill="#94A3B8">Live Progress</text>

    <rect x="18" y="72" width="179" height="60" rx="8" fill="rgba(0, 0, 0, 0.4)" stroke="rgba(255, 255, 255, 0.06)" />
    <text x="28" y="93" class="sans" font-size="11" font-weight="700" fill="#F59E0B">Downloading: 64%</text>
    <rect x="28" y="103" width="159" height="6" rx="3" fill="rgba(255,255,255,0.1)" />
    <rect x="28" y="103" width="102" height="6" rx="3" fill="#F59E0B" />
    <text x="28" y="122" class="mono" font-size="9" fill="#94A3B8">12.4 MB / 19.8 MB</text>

    <text x="18" y="160" class="sans" font-size="11" fill="#E2E8F0" font-weight="600">• Follows GitHub 302 S3</text>
    <text x="18" y="178" class="sans" font-size="11" fill="#E2E8F0" font-weight="600">• Notification tray status</text>
    <text x="18" y="196" class="sans" font-size="11" fill="#E2E8F0" font-weight="600">• Internal updates cache</text>
  </g>

  <!-- Arrow 3 to 4 -->
  <g transform="translate(754, 175)">
    <path d="M0 0 L15 0" stroke="#F59E0B" stroke-width="2" stroke-dasharray="3,3" />
    <polygon points="15,-4 22,0 15,4" fill="#F59E0B" />
  </g>

  <!-- Step 4 -->
  <g transform="translate(782, 80)" filter="url(#shadow)">
    <rect width="186" height="210" rx="14" fill="url(#stepGrad)" stroke="rgba(168, 85, 247, 0.25)" />
    <circle cx="36" cy="36" r="16" fill="rgba(168, 85, 247, 0.15)" stroke="#A855F7" stroke-width="1.5" />
    <text x="31" y="42" class="mono" font-size="14" font-weight="800" fill="#A855F7">4</text>
    <text x="64" y="34" class="sans" font-size="14" font-weight="700" fill="#FFFFFF">Native Install</text>
    <text x="64" y="49" class="mono" font-size="10" fill="#94A3B8">FileProvider</text>

    <rect x="18" y="72" width="150" height="60" rx="8" fill="rgba(16, 185, 129, 0.15)" stroke="#10B981" stroke-width="1" />
    <text x="26" y="94" class="sans" font-size="11" font-weight="700" fill="#34D399">✓ System Prompt</text>
    <text x="26" y="112" class="sans" font-size="10" fill="#E2E8F0">"Update this app?"</text>
    <text x="26" y="124" class="sans" font-size="9" fill="#94A3B8">Data preserved 100%</text>

    <text x="18" y="160" class="sans" font-size="11" fill="#E2E8F0" font-weight="600">• Zero data loss</text>
    <text x="18" y="178" class="sans" font-size="11" fill="#E2E8F0" font-weight="600">• SQLite intact</text>
    <text x="18" y="196" class="sans" font-size="11" fill="#E2E8F0" font-weight="600">• Seamless reboot</text>
  </g>
</svg>
