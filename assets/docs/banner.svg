<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070A11" />
      <stop offset="50%" stop-color="#0E1626" />
      <stop offset="100%" stop-color="#05080E" />
    </linearGradient>
    
    <linearGradient id="cyanBlueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="100%" stop-color="#0A84FF" />
    </linearGradient>

    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(30, 41, 59, 0.75)" />
      <stop offset="100%" stop-color="rgba(15, 23, 42, 0.85)" />
    </linearGradient>

    <linearGradient id="glassBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(0, 240, 255, 0.4)" />
      <stop offset="50%" stop-color="rgba(255, 255, 255, 0.1)" />
      <stop offset="100%" stop-color="rgba(16, 185, 129, 0.3)" />
    </linearGradient>

    <!-- Filters -->
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="25" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="glowEmerald" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="35" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.65" />
    </filter>
  </defs>

  <style>
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, Helvetica, Arial, sans-serif; }
    .font-mono { font-family: "JetBrains Mono", "SF Mono", Consolas, monospace; }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="440" rx="20" fill="url(#bgGrad)" />

  <!-- Subtle Cyber Tech Grid Pattern -->
  <g opacity="0.08" stroke="#00F0FF" stroke-width="1">
    <line x1="0" y1="40" x2="1200" y2="40" />
    <line x1="0" y1="120" x2="1200" y2="120" />
    <line x1="0" y1="200" x2="1200" y2="200" />
    <line x1="0" y1="280" x2="1200" y2="280" />
    <line x1="0" y1="360" x2="1200" y2="360" />
    <line x1="80" y1="0" x2="80" y2="440" />
    <line x1="200" y1="0" x2="200" y2="440" />
    <line x1="320" y1="0" x2="320" y2="440" />
    <line x1="440" y1="0" x2="440" y2="440" />
    <line x1="560" y1="0" x2="560" y2="440" />
    <line x1="680" y1="0" x2="680" y2="440" />
    <line x1="800" y1="0" x2="800" y2="440" />
    <line x1="920" y1="0" x2="920" y2="440" />
    <line x1="1040" y1="0" x2="1040" y2="440" />
    <line x1="1160" y1="0" x2="1160" y2="440" />
  </g>

  <!-- Ambient Glow Orbs -->
  <circle cx="200" cy="90" r="140" fill="#00F0FF" opacity="0.12" filter="url(#glowCyan)" />
  <circle cx="1020" cy="300" r="180" fill="#10B981" opacity="0.10" filter="url(#glowEmerald)" />

  <!-- Left Header Content -->
  <g transform="translate(64, 60)">
    <!-- Version Tag Pill -->
    <rect x="0" y="0" width="170" height="30" rx="15" fill="rgba(0, 240, 255, 0.12)" stroke="#00F0FF" stroke-width="1" />
    <circle cx="16" cy="15" r="4" fill="#00F0FF" />
    <text x="30" y="20" class="font-mono" font-size="12" font-weight="700" fill="#00F0FF" letter-spacing="1">v3.5 FINTECH PRO</text>

    <!-- Main Title -->
    <text x="0" y="80" class="font-sans" font-size="44" font-weight="900" fill="#FFFFFF" letter-spacing="-0.5">
      ABHI'S <tspan fill="url(#cyanBlueGrad)">LEDGER</tspan>
    </text>

    <!-- Subtitle -->
    <text x="0" y="116" class="font-mono" font-size="14" font-weight="600" fill="#94A3B8" letter-spacing="2">
      OFFLINE-FIRST DEBT INTELLIGENCE &amp; CREDIT LEDGER
    </text>

    <text x="0" y="146" class="font-sans" font-size="15" font-weight="400" fill="#64748B">
      Zero Cloud Telemetry • Military AES-256-GCM Encryption • 1-Tap APK Updates
    </text>

    <!-- Badges Row -->
    <g transform="translate(0, 180)">
      <!-- Badge 1 -->
      <rect x="0" y="0" width="150" height="42" rx="10" fill="rgba(255, 255, 255, 0.04)" stroke="rgba(255, 255, 255, 0.1)" />
      <circle cx="20" cy="21" r="6" fill="#10B981" />
      <text x="36" y="26" class="font-sans" font-size="12" font-weight="700" fill="#F8FAFC">100% Offline</text>

      <!-- Badge 2 -->
      <rect x="162" y="0" width="168" height="42" rx="10" fill="rgba(255, 255, 255, 0.04)" stroke="rgba(255, 255, 255, 0.1)" />
      <circle cx="182" cy="21" r="6" fill="#00F0FF" />
      <text x="198" y="26" class="font-sans" font-size="12" font-weight="700" fill="#F8FAFC">Hardware Keystore</text>

      <!-- Badge 3 -->
      <rect x="342" y="0" width="160" height="42" rx="10" fill="rgba(255, 255, 255, 0.04)" stroke="rgba(255, 255, 255, 0.1)" />
      <circle cx="362" cy="21" r="6" fill="#A855F7" />
      <text x="378" y="26" class="font-sans" font-size="12" font-weight="700" fill="#F8FAFC">1-Tap Direct Install</text>
    </g>

    <!-- Command / Fast Start Prompt -->
    <g transform="translate(0, 248)">
      <rect x="0" y="0" width="502" height="42" rx="8" fill="rgba(0, 0, 0, 0.45)" stroke="rgba(0, 240, 255, 0.25)" />
      <text x="16" y="26" class="font-mono" font-size="13" fill="#38BDF8">&gt; git clone https://github.com/Abhi10112006/Ledger-.git</text>
    </g>
  </g>

  <!-- Right Floating Futuristic Cards Graphic Mockup -->
  <g transform="translate(650, 48)" filter="url(#dropShadow)">
    
    <!-- Primary Mockup Window Card -->
    <rect x="0" y="0" width="480" height="344" rx="20" fill="url(#cardGrad)" stroke="url(#glassBorder)" stroke-width="1.5" />

    <!-- Window Topbar -->
    <rect x="0" y="0" width="480" height="44" rx="20" fill="rgba(15, 23, 42, 0.85)" />
    <path d="M0 20 Q0 0 20 0 L460 0 Q480 0 480 20 L480 44 L0 44 Z" fill="rgba(15, 23, 42, 0.9)" />
    <circle cx="28" cy="22" r="5" fill="#EF4444" />
    <circle cx="44" cy="22" r="5" fill="#F59E0B" />
    <circle cx="60" cy="22" r="5" fill="#10B981" />
    <text x="84" y="27" class="font-mono" font-size="12" font-weight="600" fill="#94A3B8">abhis-ledger.local // session-secured</text>
    <rect x="364" y="11" width="98" height="22" rx="11" fill="rgba(16, 185, 129, 0.2)" stroke="#10B981" stroke-width="0.8" />
    <text x="382" y="26" class="font-mono" font-size="10" font-weight="700" fill="#34D399">● LIVE SQLITE</text>

    <!-- Balance Hero Block -->
    <g transform="translate(24, 60)">
      <rect x="0" y="0" width="432" height="96" rx="14" fill="rgba(15, 23, 42, 0.7)" stroke="rgba(255, 255, 255, 0.08)" />
      <text x="20" y="32" class="font-mono" font-size="12" font-weight="600" fill="#94A3B8">TOTAL NET RECOVERABLE</text>
      <text x="20" y="74" class="font-sans" font-size="34" font-weight="800" fill="#34D399">+₹ 1,48,500.00</text>
      
      <!-- Trust Indicator -->
      <rect x="290" y="24" width="122" height="48" rx="10" fill="rgba(0, 240, 255, 0.12)" stroke="#00F0FF" stroke-width="1" />
      <text x="306" y="44" class="font-mono" font-size="10" font-weight="700" fill="#38BDF8">TRUST SCORE</text>
      <text x="306" y="62" class="font-sans" font-size="15" font-weight="900" fill="#FFFFFF">98 / 100 <tspan font-size="11" fill="#34D399">ELITE</tspan></text>
    </g>

    <!-- Two Micro Cards: Recent Deal & 1-Tap Update Notice -->
    <g transform="translate(24, 172)">
      <!-- Micro Deal Row -->
      <rect x="0" y="0" width="432" height="66" rx="12" fill="rgba(30, 41, 59, 0.5)" stroke="rgba(255, 255, 255, 0.06)" />
      <circle cx="34" cy="33" r="16" fill="rgba(16, 185, 129, 0.2)" stroke="#10B981" stroke-width="1" />
      <text x="28" y="38" class="font-sans" font-size="15" fill="#34D399">↑</text>
      <text x="64" y="28" class="font-sans" font-size="14" font-weight="700" fill="#FFFFFF">Rahul Sharma</text>
      <text x="64" y="48" class="font-mono" font-size="11" fill="#64748B">Given • Due in 4 days • 0% interest</text>
      <text x="330" y="38" class="font-mono" font-size="15" font-weight="700" fill="#34D399">+₹ 25,000</text>
    </g>

    <g transform="translate(24, 252)">
      <!-- 1-Tap Direct In-App Update Banner Mini -->
      <rect x="0" y="0" width="432" height="68" rx="12" fill="linear-gradient(90deg, rgba(10, 132, 255, 0.2) 0%, rgba(16, 185, 129, 0.2) 100%)" stroke="rgba(10, 132, 255, 0.4)" />
      <circle cx="34" cy="34" r="14" fill="#0A84FF" />
      <text x="28" y="39" class="font-sans" font-size="13" font-weight="900" fill="#FFFFFF">⚡</text>
      <text x="60" y="28" class="font-sans" font-size="13" font-weight="700" fill="#FFFFFF">Update v3.5 Available</text>
      <text x="60" y="46" class="font-sans" font-size="11" fill="#94A3B8">Background alert active • 1-Tap direct install</text>
      <rect x="306" y="16" width="112" height="36" rx="8" fill="#0A84FF" />
      <text x="322" y="39" class="font-sans" font-size="12" font-weight="700" fill="#FFFFFF">1-Tap Install</text>
    </g>
  </g>

  <!-- Outer Border Accent Line -->
  <rect x="1" y="1" width="1198" height="438" rx="19" fill="none" stroke="rgba(0, 240, 255, 0.25)" stroke-width="1.5" />
</svg>
